name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: '24'
  WEB_DIR: src/Web/lexflow-web

jobs:
  backend:
    name: backend (build, format, unit + arquitetura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore LexFlow.sln
      - run: dotnet build LexFlow.sln -c Release --no-restore
      - run: dotnet format LexFlow.sln --verify-no-changes --no-restore
      - name: Testes (exceto os que exigem Docker)
        run: >
          dotnet test --solution LexFlow.sln -c Release --no-build
          --filter-not-trait "Category=RequiresDocker" --ignore-exit-code 8
          --coverage --coverage-output-format cobertura --report-xunit-trx
      - name: Pacotes vulneráveis
        run: |
          dotnet list LexFlow.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/**'
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: docs/openapi/

  integration:
    name: integração (AppHost + containers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json
      - name: Certificado de desenvolvimento (Kestrel HTTPS da API)
        run: dotnet dev-certs https
      - name: Testes com Docker (Category=RequiresDocker)
        run: >
          dotnet test --project tests/LexFlow.AppHost.Tests
          --report-xunit-trx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: '**/TestResults/**'

  frontend:
    name: frontend (lint, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.WEB_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: e2e (Playwright contra o AppHost)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.WEB_DIR }}
      - run: npx playwright install --with-deps chromium
        working-directory: ${{ env.WEB_DIR }}
      - run: dotnet dev-certs https
      - name: Sobe o AppHost em background
        run: |
          nohup dotnet run --project src/Aspire/LexFlow.AppHost --launch-profile http > apphost.log 2>&1 &
      - name: Aguarda a Web (depende da API saudável)
        run: |
          for i in $(seq 1 180); do
            if curl -fsS http://localhost:4200 > /dev/null; then echo "web pronta"; exit 0; fi
            sleep 5
          done
          echo "Web não subiu em 15 min"; tail -200 apphost.log; exit 1
      - name: Playwright
        working-directory: ${{ env.WEB_DIR }}
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            ${{ env.WEB_DIR }}/playwright-report/
            apphost.log

  openapi:
    name: OpenAPI (breaking changes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Gera o documento OpenAPI
        run: dotnet build src/Host/LexFlow.Api -c Release
      - name: Documento já existe na base?
        id: base
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:docs/openapi/v1.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base sem docs/openapi/v1.json; comparação ignorada neste PR."
          fi
      - name: Documento commitado está atualizado
        run: git diff --exit-code -- docs/openapi/
      - uses: oasdiff/oasdiff-action/breaking@v0
        if: steps.base.outputs.exists == 'true'
        with:
          base: 'origin/${{ github.base_ref }}:docs/openapi/v1.json'
          revision: 'HEAD:docs/openapi/v1.json'
          fail-on: ERR
          review: false

  security:
    name: segurança (CodeQL, Gitleaks, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
      - if: matrix.language == 'csharp'
        run: dotnet build LexFlow.sln -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          # Repositório privado sem GitHub Advanced Security não aceita upload: o SARIF vira artefato.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/
      - name: Gitleaks
        if: matrix.language == 'csharp'
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
      - name: Trivy (sistema de arquivos; imagens a partir do deploy)
        if: matrix.language == 'csharp'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
